apiVersion: apps/v1
kind: Deployment

metadata:
  name: custom-html-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: custom-html-app

  template:
    metadata:
      labels:
        app: custom-html-app

    spec:
      containers:
      - name: custom-html-container
        image: custom-html-app:latest

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 80